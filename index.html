<style>
:root{--bg:#070b24;--bg2:#0d1440;--card:rgba(20,30,85,.55);--line:rgba(120,150,255,.18);--txt:#eef2ff;--mut:#9aa6d6;
--blue:#2f8cff;--cyan:#5cc8ff;--violet:#8b5cf6;--purple:#b26bff;--gold:#ffc21a;--good:#3ee08f;--bad:#ff5d7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg);
background-image:radial-gradient(900px 600px at 10% -10%,rgba(47,140,255,.28),transparent 60%),radial-gradient(800px 600px at 110% 20%,rgba(139,92,246,.30),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(255,194,26,.10),transparent 60%);
background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:760px;margin:0 auto;padding:18px 16px 60px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hero{display:flex;align-items:center;gap:16px;margin:6px 0 22px}
.hero img{width:86px;height:86px;border-radius:24px;box-shadow:0 0 0 2px rgba(255,194,26,.5),0 10px 40px rgba(47,140,255,.45)}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1;background:linear-gradient(90deg,var(--gold),#fff 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:6px;font-size:14px}
.tabs{display:flex;gap:6px;background:rgba(10,16,50,.7);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mut);transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;box-shadow:0 6px 20px rgba(47,140,255,.35)}
.tabs small{display:block;font-weight:500;font-size:11px;opacity:.8}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);margin:16px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut);background:rgba(15,22,70,.5);transition:.15s}
.chip.on{border-color:var(--cyan);color:#fff;background:rgba(47,140,255,.22)}
.chip.gold.on{border-color:var(--gold);background:rgba(255,194,26,.16)}
.count{color:var(--mut);font-size:13px;margin-top:12px}
.count b{color:var(--gold)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mode{position:relative;text-align:left;padding:20px 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);overflow:hidden;transition:transform .15s}
.mode:active{transform:scale(.98)}
.mode h2{font-size:22px;font-weight:700}
.mode p{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.35}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;filter:blur(8px);opacity:.55}
.mode.rev::after{background:var(--blue)}.mode.exa::after{background:var(--violet)}
.mode .go{display:inline-block;margin-top:14px;font-weight:700;font-size:14px;padding:8px 14px;border-radius:12px}
.mode.rev .go{background:var(--blue)}.mode.exa .go{background:linear-gradient(135deg,var(--violet),var(--purple))}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.seg{display:flex;background:rgba(10,16,50,.7);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 11px;border-radius:9px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--gold);color:#1a1300}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.sw{width:40px;height:23px;border-radius:99px;background:#26305e;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}.sw.on::after{left:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:rgba(30,42,110,.8);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--violet));border:0;box-shadow:0 8px 24px rgba(47,140,255,.35)}
.btn.gold{background:var(--gold);color:#1a1300;border:0}
.btn.good{background:rgba(62,224,143,.16);border-color:rgba(62,224,143,.5);color:var(--good)}
.btn.bad{background:rgba(255,93,122,.14);border-color:rgba(255,93,122,.5);color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.best{margin-top:16px;font-size:13px;color:var(--mut)}
.best b{color:var(--gold)}
/* jeu */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .x{width:40px;height:40px;border-radius:12px;background:rgba(30,42,110,.8);border:1px solid var(--line);font-size:18px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet),var(--gold));transition:width .3s}
.top .n{font-size:13px;color:var(--mut);min-width:54px;text-align:right}
.score{font-weight:800;color:var(--gold);font-size:15px}
.card{border-radius:26px;padding:24px 20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.5px;padding:5px 10px;border-radius:99px;background:rgba(92,200,255,.12);color:var(--cyan);border:1px solid rgba(92,200,255,.3)}
.tag em{font-style:normal;color:var(--gold)}
.q{font-size:21px;line-height:1.4;font-weight:500;margin:16px 0 4px}
.clue{padding:12px 14px;border-radius:14px;background:rgba(10,16,50,.55);border-left:3px solid var(--gold);margin-top:10px;font-size:17px;line-height:1.45;animation:pop .25s}
.clue b{color:var(--gold);font-size:13px;margin-right:6px}
.hint{color:var(--gold);font-size:14px;margin-top:8px}
.say{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 14px;border-radius:12px;background:rgba(255,194,26,.14);border:1px solid rgba(255,194,26,.4);color:var(--gold);font-weight:600;font-size:14px}
.ans{margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(47,140,255,.18),rgba(139,92,246,.18));border:1px solid rgba(92,200,255,.35);animation:pop .25s}
.ans small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
.ans div{font-size:24px;font-weight:700;margin-top:4px}
.ans.ok{background:rgba(62,224,143,.12);border-color:rgba(62,224,143,.5)}
.ans.ko{background:rgba(255,93,122,.10);border-color:rgba(255,93,122,.45)}
.ans .v{font-size:14px;color:var(--mut);margin-top:6px;font-weight:500}
input.in,textarea.in{width:100%;margin-top:18px;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(5,9,35,.7);color:#fff;font:inherit;font-size:18px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(92,200,255,.2)}
textarea.in{font-size:14px;min-height:240px;font-family:ui-monospace,Menlo,monospace}
.timer{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:16px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.timer.low i{background:var(--bad)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.acts .btn{flex:1;min-width:120px}
.keys{color:var(--mut);font-size:12px;text-align:center;margin-top:14px;opacity:.7}
.big{font-size:64px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.end{text-align:center}
.end img{width:110px;border-radius:28px;margin-bottom:12px}
.stats{display:flex;justify-content:center;gap:24px;margin:16px 0;color:var(--mut);font-size:13px}
.stats b{display:block;color:#fff;font-size:22px}
.miss{text-align:left;margin-top:20px}
.miss li{list-style:none;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.miss li span{display:block;color:var(--gold);font-weight:600;margin-top:4px}
.miss li i{color:var(--bad);font-style:normal}
.drop{margin-top:14px;border:2px dashed rgba(92,200,255,.45);border-radius:22px;padding:34px 18px;text-align:center;background:rgba(10,16,50,.45);transition:.2s}
.drop.hov{border-color:var(--gold);background:rgba(255,194,26,.08)}
.drop h3{font-size:19px}.drop p{color:var(--mut);font-size:13px;margin-top:6px;line-height:1.5}
.note{color:var(--mut);font-size:13px;line-height:1.5;margin-top:10px}
#dragcover{position:fixed;inset:0;background:rgba(7,11,36,.85);display:none;align-items:center;justify-content:center;z-index:9;font-size:22px;font-weight:700;color:var(--gold);border:3px dashed var(--gold)}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;background:var(--bg);background-image:radial-gradient(500px 400px at 50% 40%,rgba(47,140,255,.35),transparent 70%),radial-gradient(400px 300px at 60% 60%,rgba(139,92,246,.3),transparent 70%);transition:opacity .35s}
.splash.out{opacity:0}
.splash img{width:150px;height:150px;border-radius:40px;box-shadow:0 0 0 3px rgba(255,194,26,.6),0 0 60px rgba(47,140,255,.6);animation:spin 1.5s cubic-bezier(.6,0,.2,1) both}
.splash h1{font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--gold),#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s .9s both}
@keyframes spin{0%{transform:rotate(-360deg) scale(.3);opacity:0}70%{opacity:1}100%{transform:rotate(0) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.onb{max-width:420px;margin:0 auto;padding-top:4vh;text-align:center;animation:pop .35s}
.onb img{width:96px;height:96px;border-radius:26px;box-shadow:0 0 0 2px rgba(255,194,26,.5),0 10px 40px rgba(47,140,255,.45)}
.onb h1{font-size:30px;font-weight:800;margin-top:14px}
.onb p{color:var(--mut);margin-top:4px}
.onb form{text-align:left;margin-top:18px}
.onb label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:12px;text-transform:uppercase;letter-spacing:1px}
.onb label .in{margin-top:6px;text-transform:none;letter-spacing:0}
.onb .go{width:100%;margin-top:22px;font-size:20px;padding:16px}
.onb small{display:block;color:var(--mut);font-size:12px;margin-top:14px}
.me{margin-left:auto;width:42px;height:42px;flex:none;border-radius:50%;font-weight:800;font-size:18px;color:#1a1300;background:var(--gold);box-shadow:0 4px 16px rgba(255,194,26,.35)}
.choices{display:grid;gap:9px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(10,16,50,.6);font-size:16px;font-weight:500;transition:.15s}
.choice b{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:rgba(47,140,255,.2);color:var(--cyan)}
.choice:active{transform:scale(.98)}
.choice.ok{border-color:var(--good);background:rgba(62,224,143,.16)}.choice.ok b{background:var(--good);color:#04210f}
.choice.ko{border-color:var(--bad);background:rgba(255,93,122,.14)}.choice.ko b{background:var(--bad);color:#fff}
.choice.dim{opacity:.45}.choice:disabled{cursor:default}
.mode.onl::after{background:var(--good);opacity:.35}.mode.onl .go{background:var(--good);color:#04210f}.mode.duo::after{background:var(--gold);opacity:.35}.mode.duo .go{background:var(--gold);color:#1a1300}
.duel{position:fixed;inset:0;z-index:4;display:grid;grid-template-rows:1fr auto 1fr;background:var(--bg);background-image:radial-gradient(600px 400px at 50% 100%,rgba(47,140,255,.25),transparent 70%),radial-gradient(600px 400px at 50% 0%,rgba(139,92,246,.28),transparent 70%)}
.half{display:flex;flex-direction:column;gap:8px;padding:12px 12px max(12px,env(safe-area-inset-bottom));min-height:0}
.half.flip{transform:rotate(180deg);padding-bottom:12px}
.half .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.half .hd b{color:var(--gold);font-size:26px}
.half .dq{font-size:16px;line-height:1.35;max-height:34%;overflow:auto;flex:none}
.half .dq em{font-style:normal;color:var(--gold);font-size:13px;font-weight:600}
.buzz{flex:1;min-height:90px;border-radius:26px;font-size:40px;font-weight:800;letter-spacing:3px;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s}
.p0 .buzz{background:radial-gradient(circle at 50% 35%,#5cc8ff,#2f8cff 55%,#1a4fb0);box-shadow:0 0 40px rgba(47,140,255,.55)}
.p1 .buzz{background:radial-gradient(circle at 50% 35%,#d4a5ff,#8b5cf6 55%,#4b2a9e);box-shadow:0 0 40px rgba(139,92,246,.55)}
.buzz:active{transform:scale(.97)}
.state{flex:1;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:24px;border:1px dashed var(--line);text-align:center;padding:10px;font-size:18px;font-weight:600}
.state small{font-size:13px;color:var(--mut);font-weight:500}
.state.win{border:2px solid var(--good);background:rgba(62,224,143,.12)}
.state.lose{border-color:rgba(255,93,122,.6);background:rgba(255,93,122,.08)}
.state.talk{border:2px solid var(--gold)}
.big2{font-size:24px;font-weight:800;color:#fff}
.heard{color:var(--cyan);font-size:16px;min-height:20px}
.mic{width:58px;height:58px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(255,93,122,.6);animation:pulse 1.1s infinite}
.fast{flex:1;min-height:150px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;position:relative}
.fbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:20px;color:#fff;font-weight:700;font-size:15px;line-height:1.2;text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s}
.fbtn b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:14px}
.p0 .fbtn{background:radial-gradient(circle at 50% 30%,#4fb6ff,#2f8cff 60%,#1a4fb0);box-shadow:0 0 18px rgba(47,140,255,.4)}
.p1 .fbtn{background:radial-gradient(circle at 50% 30%,#c49bff,#8b5cf6 60%,#4b2a9e);box-shadow:0 0 18px rgba(139,92,246,.4)}
.fbtn:active{transform:scale(.96)}.fbtn:disabled{opacity:.18;filter:grayscale(1)}
.rep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;background:var(--gold);color:#1a1300;font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;pointer-events:none}
@keyframes fadein{0%,60%{opacity:.3;pointer-events:none}100%{opacity:1}}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,93,122,0)}100%{box-shadow:0 0 0 0 rgba(255,93,122,0)}}
.half .choices{animation:fadein .5s;flex:1;margin-top:0;align-content:center;gap:7px}.half .choice{padding:10px 12px;font-size:15px}
.mid{display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(0,0,0,.4);border-block:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}
.mid .x{width:34px;height:34px;border-radius:10px;background:rgba(30,42,110,.8);border:1px solid var(--line);font-size:16px;flex:none}
.onb .seg{display:inline-flex}.onb .seg button:disabled{opacity:.35}
.codein{margin:0!important;flex:1;text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800;font-size:22px!important}
.codebox{text-align:center;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.codebox small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--gold);margin:4px 0 10px;padding-left:10px}
.peer{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:8px;border-radius:16px;background:rgba(10,16,50,.6);border:1px solid var(--line)}
.peer .pn{flex:1;min-width:0}.peer .pn b{display:block}.peer .pn small{color:var(--mut);font-size:12px}
.peer .btn{padding:9px 14px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);flex:none}.dot.busy{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ov{position:fixed;inset:0;z-index:8;background:rgba(5,8,28,.8);display:flex;align-items:center;justify-content:center;padding:20px;animation:pop .25s}
.ovc{max-width:360px;width:100%;text-align:center;padding:26px 20px;border-radius:26px;background:#10183f;border:2px solid var(--gold);box-shadow:0 0 60px rgba(255,194,26,.25)}
.ovc img{width:72px;border-radius:20px}.ovc h2{margin-top:10px;font-size:22px}.ovc p{color:var(--mut);margin-top:4px}
.oplay{display:flex;flex-direction:column;min-height:calc(100dvh - 30px)}
.vs{display:flex;align-items:center;justify-content:space-around;padding:10px;margin-bottom:10px;border-radius:18px;background:rgba(10,16,50,.6);border:1px solid var(--line)}
.vs div{text-align:center}.vs small{display:block;color:var(--mut);font-size:12px}.vs b{font-size:28px;color:var(--gold)}.vs span{font-weight:800;color:var(--mut)}
.ocard{display:flex;flex-direction:column;min-height:0!important}.ocard .fast{flex:1;max-height:300px;min-height:180px}.ocard .obuzz{max-height:260px}.ocard .fast,.ocard .state{margin-top:14px}
#layer{position:fixed;inset:0;pointer-events:none;z-index:9}#layer>*{pointer-events:auto}
.toasts{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:18px;background:#10183f;border:1px solid var(--good);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(62,224,143,.25);animation:drop .3s}
.toast .tt{flex:1;min-width:0;font-size:15px}.toast .tt small{display:block;color:var(--mut);font-size:12px}
.toast .btn{padding:9px 14px;font-size:14px}.toast .tx{width:30px;height:30px;color:var(--mut);font-size:15px;flex:none}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.pill{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;margin-bottom:10px;border-radius:14px;background:rgba(62,224,143,.10);border:1px solid rgba(62,224,143,.4);font-size:14px;font-weight:600}
.dot.off{background:var(--mut);box-shadow:none}
.board{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
